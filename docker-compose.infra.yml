# Database only, for local development. Run the API with `npm run dev` in ./backend
# and the storefront with `npm run dev` in ./frontend.
#   docker compose -f docker-compose.infra.yml up -d
# Do not run this and docker-compose.yml at the same time (both use port 5432).
services:
  postgres:
    image: postgres:16-alpine
    container_name: amy_bakery_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-amy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
      POSTGRES_DB: ${POSTGRES_DB:-amy_bakery}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-amy} -d ${POSTGRES_DB:-amy_bakery}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
    name: amy_bakery_data
