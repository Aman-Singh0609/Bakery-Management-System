# Example only. Do NOT commit real values.
# Prefer External Secrets / Sealed Secrets in a real cluster:
#   kubectl create secret generic amy-bakery-secret \
#     --from-literal=POSTGRES_USER=amy \
#     --from-literal=POSTGRES_PASSWORD='...' \
#     --from-literal=POSTGRES_DB=amy_bakery \
#     --from-literal=DATABASE_URL='postgresql://amy:...@postgres:5432/amy_bakery?schema=public' \
#     --from-literal=JWT_ACCESS_SECRET='...' \
#     --from-literal=JWT_REFRESH_SECRET='...' \
#     --from-literal=RAZORPAY_KEY_ID='...' \
#     --from-literal=RAZORPAY_KEY_SECRET='...' \
#     --from-literal=RAZORPAY_WEBHOOK_SECRET='...' \
#     --from-literal=ADMIN_EMAIL='you@example.com' \
#     --from-literal=ADMIN_PASSWORD='...'
apiVersion: v1
kind: Secret
metadata:
  name: amy-bakery-secret
  namespace: default
type: Opaque
stringData:
  POSTGRES_USER: "amy"
  POSTGRES_PASSWORD: "replace-me"
  POSTGRES_DB: "amy_bakery"
  DATABASE_URL: "postgresql://amy:replace-me@postgres:5432/amy_bakery?schema=public"
  JWT_ACCESS_SECRET: "replace-with-at-least-32-random-characters"
  JWT_REFRESH_SECRET: "replace-with-another-32-random-characters"
  RAZORPAY_KEY_ID: ""
  RAZORPAY_KEY_SECRET: ""
  RAZORPAY_WEBHOOK_SECRET: ""
  ADMIN_EMAIL: ""
  ADMIN_PASSWORD: ""
